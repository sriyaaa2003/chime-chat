<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
     <link rel="stylesheet" href="auth.css">
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@5.2.10/dist/amazon-cognito-identity.min.js"></script>
</head>
<body>
    <h2>Forgot Password</h2>
    <form id="forgotPasswordForm">
        <input type="text" id="username" placeholder="Username" required>
        <button type="submit">Send Verification Code</button>
    </form>

    <div id="resetPasswordSection" style="display: none;">
        <h3>Reset Password</h3>
        <form id="resetPasswordForm">
            <input type="text" id="verificationCode" placeholder="Verification code" required>
            <input type="password" id="newPassword" placeholder="New password" required>
            <button type="submit">Reset Password</button>
        </form>
    </div>

    <script>
        const poolData = {
            UserPoolId: 'ap-south-1_qwX4Nczmv',
            ClientId: '2tgvgg0jn22kdq3g2v8dilslsk'
        };
        const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
        let cognitoUser;

        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            
            const userData = {
                Username: username,
                Pool: userPool
            };
            cognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);
            
            cognitoUser.forgotPassword({
                onSuccess: function(data) {
                    alert('Verification code sent');
                    document.getElementById('resetPasswordSection').style.display = 'block';
                },
                onFailure: function(err) {
                    alert(err.message || JSON.stringify(err));
                }
            });
        });

        document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const verificationCode = document.getElementById('verificationCode').value;
            const newPassword = document.getElementById('newPassword').value;
            
            cognitoUser.confirmPassword(verificationCode, newPassword, {
                onSuccess: function() {
                    alert('Password changed successfully');
                    window.location.href = 'signin.html';
                },
                onFailure: function(err) {
                    alert(err.message || JSON.stringify(err));
                }
            });
        });
    </script>
</body>
</html>
