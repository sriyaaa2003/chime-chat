
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chime - Chat Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
    <div class="logo-container">
        <div class="logo">Chime<span>.</span></div>
    </div>

    <button class="sidebar-toggle left-toggle">
        <i class="fas fa-users"></i>
    </button>
    <button class="sidebar-toggle right-toggle">
        <i class="fas fa-comments"></i>
    </button>

    <div class="sidebar-left">
        <h3><i class="fas fa-user-friends"></i> Online Users</h3>
        <ul id="online-users-list">
            <!-- Dynamically populated -->
        </ul>
    </div>

    <div class="sidebar-right">
        <h3><i class="fas fa-comment-dots"></i> Chat Rooms</h3>
        <button id="create-room-btn" class="btn btn-sm btn-warning mb-2">
            <i class="fas fa-plus"></i> Create Room
        </button>
        <ul id="chat-rooms-list">
            <!-- Dynamically populated -->
        </ul>
    </div>

    <div class="welcome-screen">
        <h2>Welcome to Chime</h2>
        <p>
            Connect with your friends and colleagues in real-time.
            Start by selecting a chat or creating a new room.
        </p>
    </div>

    <div class="chat-screen">
        <div class="chat-header">
            <h4 id="current-chat-title">Select a chat</h4>
            <div id="current-participants"></div>
        </div>
        <div class="chat-messages" id="messages-container">
            <!-- Messages will appear here -->
        </div>
        <div class="chat-input">
            <input type="text" id="message-input" placeholder="Type your message...">
            <button id="send-button"><i class="fas fa-paper-plane"></i></button>
            <label for="file-upload" class="file-upload-btn">
                <i class="fas fa-paperclip"></i>
            </label>
            <input id="file-upload" type="file">
        </div>
    </div>

    <div class="embellishment top-left"></div>
    <div class="embellishment bottom-right"></div>

<link rel="stylesheet" href="styles.css">
<script src="socket.js"></script>
<script src="app.js"></script>
</body>
</html>
